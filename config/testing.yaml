environment: testing
random_seed: 42
paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  models: models
  results: results
  database: data/app/test_unused.db   # tests always supply a temporary database
data:
  target: "Carrs_Index_percent >= 25"
  validation: leave-one-material-out
model:
  version: "1.1.0"
api:
  cors_origins:
    - http://localhost:5173
  max_body_bytes: 65536
security:
  token_ttl_seconds: 3600
  max_login_failures: 3
  lockout_minutes: 15
