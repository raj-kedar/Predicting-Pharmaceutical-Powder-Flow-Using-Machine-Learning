environment: development
random_seed: 42
paths:
  raw_data: data/raw
  interim_data: data/interim
  processed_data: data/processed
  models: models
  results: results
  database: data/app/flowtool.db
data:
  target: "Carrs_Index_percent >= 25"
  validation: leave-one-material-out
model:
  version: "1.1.0"
api:
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  max_body_bytes: 65536
security:
  token_ttl_seconds: 28800
  max_login_failures: 5
  lockout_minutes: 15
