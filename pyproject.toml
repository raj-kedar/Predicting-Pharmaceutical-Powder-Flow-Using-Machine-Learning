[project]
name = "pharmaceutical-powder-flow-classification"
version = "2.0.0"
description = "Pharmaceutical powder flowability classification API with USP <1174> rules and validated screening models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint.per-file-ignores]
# Kept byte-identical to the file the validated models were trained with.
"src/models/forest.py" = ["E"]
