[project]
name = "pharmaceutical-powder-flow-classification"
version = "0.1.0"
description = "Pharmaceutical powder flowability classification using real laboratory data and machine learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]
